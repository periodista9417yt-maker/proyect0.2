name: Cambiar idioma de Roblox

on:
  workflow_dispatch:   # permite ejecutarlo manualmente desde la pestaña "Actions"

jobs:
  change-language:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
 cache: 'npm'        
        cache-dependency-path: 'scripts/package-lock.json' # Apesta aquí a tu archivo

      - name: Instalar dependencias
        run: |
          cd scripts
          npm install

      - name: Instalar navegadores de Playwright
        run: |
          cd scripts
          npx playwright install --with-deps chromium

      - name: Ejecutar script de cambio de idioma
        env:
          ROBLOSECURITY: ${{ secrets.ROBLOSECURITY }}
        run: |
          cd scripts
          node change-language.js

      - name: Subir captura de error (si falló)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error-screenshot
          path: scripts/error-screenshot.png
          if-no-files-found: ignore
