name: Flujo Completo Roblox (Idioma y Cámara)

on:
  workflow_dispatch: # Permite ejecutarlo manualmente desde la pestaña "Actions"

jobs:
  automation-run:
    runs-on: ubuntu-latest
    
    # CORREGIDO: Eliminado cualquier residuo de formato inválido en la referencia del contenedor
    container:
      image: ://microsoft.com

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Instalar dependencias del proyecto
        run: |
          npm init -y
          npm install @playwright/test

      - name: Ejecutar Test Unificado
        env:
          ROBLOSECURITY: ${{ secrets.ROBLOSECURITY }}
          SITE_URL: ${{ secrets.SITE_URL }}
        # Se fuerza la ejecución en el navegador Chromium incorporado en la imagen de Docker
        run: npx playwright test tests/roblox-flow.spec.js --project=chromium

      - name: Subir evidencias en caso de error
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-errores
          path: |
            test-results/
            error-screenshot.png
          if-no-files-found: ignore
