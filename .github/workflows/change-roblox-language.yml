name: Roblox Playwright Automation

on:
  workflow_dispatch:

jobs:
  roblox:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install npm dependencies & Stealth
        run: |
          npm ci
          npm install playwright-extra puppeteer-extra-plugin-stealth

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Check video
        run: |
          echo "Comprobando vídeo..."
          test -f videos/video1.mp4
          ls -lh videos/video1.mp4

      - name: Run Roblox automation
        env:
          ROBLOSECURITY: ${{ secrets.ROBLOSECURITY }}
        run: |
          node change-language.js

      - name: Upload execution artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roblox-automation-results
          path: |
            injected-video-screenshot.png
            success-screenshot.png
            error-screenshot.png
            error-page.html
          if-no-files-found: ignore
          
      - name: Install npm dependencies
        run: |
          npm install
          npm install playwright-extra puppeteer-extra-plugin-stealth
