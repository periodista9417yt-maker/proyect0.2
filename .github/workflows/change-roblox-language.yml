name: Flujo Completo Roblox (Idioma y Cámara)

on:
  workflow_dispatch: # Permite ejecutarlo manualmente desde la interfaz web de GitHub Actions

jobs:
  automation-run:
    runs-on: ubuntu-latest
    
    # Imagen oficial de Playwright con navegadores listos para ahorrar tiempo de instalación
    container:
      image: ://microsoft.com

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Instalar dependencias del proyecto
        run: npm install

      - name: Ejecutar Test Unificado
        env:
          # Inyección segura de las variables secretas guardadas en tu repositorio
          ROBLOSECURITY: ${{ secrets.ROBLOSECURITY }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: npx playwright test tests/roblox-flow.spec.js

      - name: Subir evidencias en caso de error
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-errores
          path: |
            test-results/
            error-screenshot.png
          if-no-files-found: ignore
