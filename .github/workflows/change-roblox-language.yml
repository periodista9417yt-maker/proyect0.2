name: Cambiar idioma de Roblox

on:
  workflow_dispatch:   # permite ejecutarlo manualmente desde la pestaña "Actions"

jobs:
  change-language:
    runs-on: ubuntu-latest
    # Imagen oficial de Playwright: ya trae Node.js y Chromium instalados,
    # así nos ahorramos el paso de "npx playwright install --with-deps",
    # que era el que más tiempo y recursos consumía.
    container:
      image: mcr.microsoft.com/playwright:v1.47.0-jammy

    steps:
      - name: Clonar repo
        uses: actions/checkout@v4

      - name: Instalar dependencias
        run: |
          cd scripts
          npm install

      - name: Ejecutar script de cambio de idioma
        env:
          ROBLOSECURITY: ${{ secrets.ROBLOSECURITY }}
        run: |
          cd scripts
          node change-language.js

      - name: Subir captura de error (si falló)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error-screenshot
          path: scripts/error-screenshot.png
          if-no-files-found: ignore
