name: Roblox Playwright Automation

on:
  workflow_dispatch:

jobs:
  roblox:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install npm dependencies & Stealth
        run: |
          npm install
          npm install playwright-extra puppeteer-extra-plugin-stealth

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Instalar FFmpeg y convertir video MP4 a Y4M
        run: |
          echo "➡️ Instalando FFmpeg..."
          sudo apt-get update && sudo apt-get install -y ffmpeg
         
          echo "➡️ Comprobando vídeo en la carpeta videos/..."
          test -f videos/video1.mp4
          ls -lh videos/video1.mp4

          echo "➡️ Convirtiendo MP4 a Y4M (requerido para WebRTC en Chromium)..."
          ffmpeg -i videos/video1.mp4 -pix_fmt yuv420p video-captura.y4m
          ls -lh video-captura.y4m

      - name: Run Roblox automation
        env:
          ROBLOSECURITY: ${{ secrets.ROBLOSECURITY }}
        run: |
          node change-language.js

      - name: Upload execution artifacts and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roblox-automation-results
          path: |
            *.png
            *.html
          if-no-files-found: ignore
