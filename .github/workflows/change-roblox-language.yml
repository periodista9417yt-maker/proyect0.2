name: Roblox Playwright Automation

on:
  workflow_dispatch:

jobs:
  roblox:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install npm dependencies & Stealth
        run: |
          npm install

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium



      # Volvemos a generar el archivo .y4m pero optimizado milimétricamente
      - name: Instalar FFmpeg y convertir video MP4 a Y4M de alta fidelidad
        run: |
          echo "➡️ Instalando FFmpeg..."
          sudo apt-get update && sudo apt-get install -y ffmpeg
         
          echo "➡️ Comprobando vídeo en la carpeta videos/..."
          test -f videos/video1.mp4
          ls -lh videos/video1.mp4

          echo "➡️ Convirtiendo MP4 a Y4M con framerate constante (30 fps) y formato YUV420P nativo..."
          # -r 30 asegura que no existan micro-saltos de FPS que delaten el bot
          # -vsync cfr fuerza una sincronización constante de cuadros requerida por WebRTC
          ffmpeg -i videos/video1.mp4 -vf "noise=alls=7:allf=t+u,format=yuv420p" -r 29.97 video-captura.y4m

          ls -lh video-captura.y4m


      - name: Run Roblox automation
        env:
          ROBLOSECURITY: ${{ secrets.ROBLOSECURITY }}
        run: |
          xvfb-run --server-args="-screen 0 1280x1024x24" node change-language.js
     
      

          
      - name: Upload execution artifacts and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roblox-automation-results
          path: |
            *.png
            *.html
          if-no-files-found: ignore
